<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - {{ product_name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <style>
        /* Signup page: same centered gradient layout as login */
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .signup-card {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
        }
        .signup-card .brand-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .signup-card h2 {
            font-weight: 800;
            font-size: 1.3rem;
            color: #2c3e50;
            margin-top: 0.5rem;
        }
        .btn-signup {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.4);
        }
    </style>
</head>
<body>
    <div class="signup-card text-center">
        <i class="bi bi-person-plus brand-icon"></i>
        <h2>{{ product_name }}</h2>
        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem;">
            Create a new account (default password: <code>welcome123</code>)
        </p>

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> {{ success }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="POST" action="/signup">
            <div class="mb-3 text-start">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Choose a username" required autofocus>
                </div>
            </div>
            <div class="mb-3 text-start">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="Enter email address" required>
                </div>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label fw-semibold">
                    Password <small class="text-muted">(optional, defaults to welcome123)</small>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Leave blank for default password">
                </div>
            </div>
            <button type="submit" class="btn btn-success btn-signup w-100 mb-3">
                <i class="bi bi-person-check"></i> Create Account
            </button>
        </form>
        <p class="mt-3 mb-0" style="font-size: 0.85rem;">
            Already have an account?
            <a href="/login" style="color: #11998e; font-weight: 600;">Sign In</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

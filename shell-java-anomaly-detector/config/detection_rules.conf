# =============================================================================
# detection_rules.conf — Detection configuration for shell-based anomaly detector
#
# This is the shell-friendly equivalent of config/detection_rules.yaml.
# Uses key=value format that can be sourced directly by bash scripts.
# =============================================================================

# ---- Baseline settings ----
# Number of days of historical data to use for baseline calculation
BASELINE_WINDOW_DAYS=30
# Minimum number of observations per (hour, dow) bucket before a baseline is valid
SEASONAL_MIN_SAMPLES=4

# ---- Z-Score detector thresholds ----
# Z-score above which a WARNING-level anomaly is raised
ZSCORE_WARNING_THRESHOLD=2.0
# Z-score above which a CRITICAL-level anomaly is raised
ZSCORE_CRITICAL_THRESHOLD=3.0

# ---- Seasonal detector threshold ----
# Number of standard deviations from the seasonal mean to trigger detection
SEASONAL_DEVIATION_THRESHOLD=2.5

# ---- Error rate thresholds ----
# Error rate (0.0-1.0) above which a warning is raised
ERROR_RATE_WARNING=0.05
# Error rate above which a critical alert is raised
ERROR_RATE_CRITICAL=0.10

# ---- Alerting configuration ----
# Minutes to wait before re-alerting on the same anomaly
ALERT_COOLDOWN_MINUTES=15
# Window (minutes) for deduplicating anomaly alerts
ALERT_DEDUPLICATION_WINDOW=30
# Webhook URL for sending alert notifications (empty = disabled)
ALERT_WEBHOOK_URL=

# ---- Dashboard settings ----
# Port for the Java web dashboard
DASHBOARD_PORT=8080
# Bind address for the dashboard
DASHBOARD_HOST=0.0.0.0

# ---- Logging ----
LOG_LEVEL=INFO
